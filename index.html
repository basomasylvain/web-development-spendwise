<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Budget Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="app-header">
    <h1>My Budget Tracker</h1>
    <p class="subtitle">Track your income and expenses in one place.</p>
  </header>

  <main>
    <section id="add-expense-section" class="card">
      <h2>Add Expense</h2>

      <div class="form-group">
        <label for="expense-name">Expense Name</label>
        <input
          type="text"
          id="expense-name"
          name="expense-name"
          placeholder="e.g., Groceries, Bus Fare"
        />
      </div>

      <div class="form-group">
        <label for="expense-amount">Amount</label>
        <input
          type="number"
          id="expense-amount"
          name="expense-amount"
          placeholder="e.g., 1500"
          step="0.01"
        />
      </div>

      <div class="form-group">
        <label for="expense-category">Category</label>
        <select id="expense-category" name="expense-category">
          <option value="">-- Select a category --</option>
          <option value="food">Food &amp; Groceries</option>
          <option value="transport">Transport</option>
          <option value="utilities">Utilities &amp; Bills</option>
          <option value="entertainment">Entertainment</option>
          <option value="other">Other</option>
        </select>
      </div>

      <button type="button" class="btn-primary">Add Expense</button>
    </section>

    <section id="expenses-list-section" class="card">
      <h2>Your Expenses</h2>
      <p class="placeholder-text">No expenses yet</p>
    </section>
  </main>
</body>
</html>
